[package]
name = "setupmaker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Setup Maker: cross-platform builder of Inno-style Windows installers"
build = "build.rs"

[[bin]]
name = "setupmaker"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
smk-core = { path = "../core", features = ["encode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg", "ico", "gif"] }
editpe = { version = "0.2", default-features = false, features = ["std"] }
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15", optional = true }
