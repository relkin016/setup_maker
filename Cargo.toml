[workspace]
resolver = "2"
members = ["crates/core", "crates/stub", "crates/builder"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
authors = ["Relkin016"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.smk-stub]
opt-level = "s"
